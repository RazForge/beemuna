name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: beemuna
          POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
          POSTGRES_DB: beemuna
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready -U beemuna
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://beemuna:${POSTGRES_PASSWORD}@localhost:5433/beemuna
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: __CHANGE_ME__
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          cd apps/api
          python -m venv .venv
          .venv/Scripts/activate
          pip install -r requirements.txt
      - name: Run tests
        run: |
          cd apps/api
          .venv/Scripts/python.exe -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Typecheck
        run: |
          cd apps/web
          npm ci
          npx tsc --noEmit
